[project]
name = "curriculum-intelligence-backend"
version = "0.1.0"
description = "FastAPI backend for the AI-Powered Curriculum Intelligence & Verification Framework"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.15",
    "email-validator>=2.2",
    "fastapi>=0.116",
    "psycopg[binary]>=3.2",
    "pwdlib[argon2]>=0.3",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "PyJWT>=2.10",
    "sqlalchemy>=2.0.41",
    "uvicorn[standard]>=0.35",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.4",
    "ruff>=0.12",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
