# Optional development Neo4j instance for the Knowledge graph tab.
# Usage:
#   docker compose -f scripts/neo4j-compose.yml up -d
# Then set NEO4J_URI=bolt://localhost:7687 and the password below in backend/.env.
name: curriculum-neo4j

services:
  neo4j:
    image: neo4j:5.26-community
    container_name: curriculum-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-curriculum-dev-password}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-curriculum-dev-password}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p $$NEO4J_PASSWORD 'RETURN 1' || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

volumes:
  neo4j-data:
  neo4j-logs:
